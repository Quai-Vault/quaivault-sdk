name: Release

# Publishes via npm trusted publishing (OIDC) — no NPM_TOKEN involved.
#
# npm mints a short-lived, workflow-scoped credential from the OIDC token GitHub
# issues, so there is no long-lived secret to leak or rotate, and the account's
# "require 2FA for writes" setting no longer blocks CI (that setting governs
# token auth, which this bypasses entirely).
#
# The trusted publisher is configured on npmjs.com under the package's settings and
# must name this file — `release.yml` — exactly. npm does not validate that config
# when saved, so a mismatch only surfaces as a failure here.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets GitHub mint the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing does not support self-hosted runners
    env:
      # `npm publish` triggers prepublishOnly, which calls sync-abis with no arguments.
      # A --contracts flag cannot reach it, so the path is supplied via the environment.
      QUAIVAULT_CONTRACTS: ${{ github.workspace }}/contracts
    steps:
      - uses: actions/checkout@v4

      # `prepublishOnly` runs `sync-abis --check`, which compares src/abi against the
      # contracts' compiled artifacts. Without this checkout the publish aborts, because
      # the script correctly refuses to pass when it has nothing to compare against.
      # `artifacts/` is gitignored upstream, so it has to be compiled here.
      - name: Check out quaivault-contracts
        uses: actions/checkout@v4
        with:
          repository: Quai-Vault/quaivault-contracts
          path: contracts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.x.
      - name: Upgrade npm for OIDC support
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Compile contracts
        working-directory: contracts
        run: |
          npm ci
          npx hardhat compile

      - name: Confirm artifacts were produced
        run: test -d contracts/artifacts/contracts || {
          echo "::error::hardhat produced no artifacts; refusing to publish unverified ABIs";
          exit 1;
          }

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Fail fast on drift before the publish, rather than discovering it inside
      # prepublishOnly. Both resolve the contracts through QUAIVAULT_CONTRACTS.
      - name: Verify ABIs match the contracts
        run: npm run sync-abis -- --check

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No --provenance flag and no NODE_AUTH_TOKEN: trusted publishing from a public
      # repository generates provenance automatically, and OIDC supplies the credential.
      - name: Publish to npm
        run: npm publish
