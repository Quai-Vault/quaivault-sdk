name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor `engines` declares, and the floor @supabase/supabase-js
        # requires — it needs a global WebSocket, which Node 20 lacks. Testing the
        # floor as well as current catches a version-only break before release.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Packaged tarball installs and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm pack

      # Catches export-map mistakes a source-tree test cannot: a broken "exports"
      # field, a missing subpath, or types that fail to resolve for a consumer.
      - name: Install into a clean project
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/quaivault-sdk-*.tgz

      - name: Import via ESM
        working-directory: /tmp/consumer
        run: |
          node --input-type=module -e "
            import { connect, isUsableQuaiAddress } from '@quaivault/sdk';
            import { QuaiVaultAbi } from '@quaivault/sdk/abi';
            if (typeof connect !== 'function') throw new Error('esm entry export missing');
            if (!Array.isArray(QuaiVaultAbi)) throw new Error('abi subpath broken');
            if (isUsableQuaiAddress('0x0081111111111111111111111111111111111111')) {
              throw new Error('Qi address was accepted');
            }
          "

      - name: Import via CommonJS
        working-directory: /tmp/consumer
        run: |
          node -e "
            const { connect, decodeRevert } = require('@quaivault/sdk');
            const { QuaiVaultAbi } = require('@quaivault/sdk/abi');
            if (typeof connect !== 'function') throw new Error('cjs entry export missing');
            if (!Array.isArray(QuaiVaultAbi)) throw new Error('cjs abi subpath broken');
            if (decodeRevert('0x4b9fc0de')?.name !== 'AlreadyAnOwner') {
              throw new Error('revert decoding broken');
            }
          "

      - name: Types resolve under strict mode
        working-directory: /tmp/consumer
        run: |
          npm install -D typescript@5 >/dev/null
          cat > t.ts <<'TS'
          import { connect, type VaultTransaction, type ExecuteResult } from '@quaivault/sdk';
          const qv = connect({ network: 'testnet' });
          export const f = (): Promise<VaultTransaction> =>
            qv.vault('0x00aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')
              .transaction('0x' + 'ab'.repeat(32));
          export const g = (r: ExecuteResult) => r.outcome;
          TS
          npx tsc --noEmit --strict --moduleResolution bundler --module esnext \
                  --target es2022 --skipLibCheck t.ts

  abi-drift:
    name: ABIs match quaivault-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `artifacts/` is gitignored in quaivault-contracts, so checking that repo out
      # yields source only. The ABIs must be compiled here — otherwise this job would
      # find no artifacts and pass without having verified anything.
      - name: Check out quaivault-contracts
        uses: actions/checkout@v4
        with:
          repository: Quai-Vault/quaivault-contracts
          path: contracts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile contracts
        working-directory: contracts
        # hardhat.config.ts defaults every env var it reads, and each network's account
        # list falls back to empty, so compilation needs no configuration or secrets.
        run: |
          npm ci
          npx hardhat compile

      - name: Confirm artifacts were produced
        # Guards against a silent pass if the contracts build layout ever changes.
        run: test -d contracts/artifacts/contracts || {
          echo "::error::hardhat produced no artifacts; the drift check cannot run";
          exit 1;
          }

      - run: npm ci

      - name: Fail if src/abi drifted from the compiled artifacts
        run: npm run sync-abis -- --check --contracts contracts
